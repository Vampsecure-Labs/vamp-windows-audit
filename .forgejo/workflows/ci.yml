name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: docker
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v3
      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest ruff
          pip install . --no-deps
      - name: Lint
        run: ruff check . --select E,F,W,I --ignore E501 --extend-exclude build
      - name: Test
        run: pytest -v
