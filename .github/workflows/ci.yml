name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          pip install --upgrade pip setuptools wheel
          pip install pytest ruff
          pip install . --no-deps
      - name: Lint
        run: ruff check . --select E,F,W,I --ignore E501 --extend-exclude build
      - name: Test
        run: pytest -v
